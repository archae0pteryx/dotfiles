# Linux-only Ghostty settings, loaded after shared.conf.
#
# ~/.config/ghostty/config stays a plain Omarchy-owned file (omarchy font set
# and omarchy display text size rewrite it with sed -i, which would replace a
# stow symlink). It just includes shared.conf and this file.
#
# Font family and size are left to Omarchy. Anything set here overrides it.

# Quick terminal toggle. Hyprland ignores the trigger below: Ghostty registers
# it with the GlobalShortcuts portal and ~/.config/hypr/bindings.lua binds the
# actual key with hl.dsp.global. Needs Ghostty running in the background
# (systemctl --user enable app-com.mitchellh.ghostty.service).
keybind = global:super+alt+space=toggle_quick_terminal

# Overrides shared.conf. With autohide on, Hyprland's hotkey only sometimes
# hides the quick terminal; with it off, the hotkey toggles reliably.
quick-terminal-autohide = false
