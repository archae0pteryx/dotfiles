# Omarchy rewrites its main config with sed -i, which would replace a Stow symlink.
# Leave font family and size there so Omarchy can manage them.

# Hyprland binds the portal shortcut in ~/.config/hypr/bindings.lua via hl.dsp.global.
# Keep Ghostty running: systemctl --user enable app-com.mitchellh.ghostty.service.
keybind = global:super+alt+space=toggle_quick_terminal

# Autohide makes Hyprland's quick-terminal toggle unreliable.
quick-terminal-autohide = false
