# Refuse every sleep state, whoever asks: the Omarchy menu, `systemctl suspend`
# over SSH, or an app. On the 2016-2017 MacBook Pros resume is unreliable (the
# Apple S3X NVMe and Alpine Ridge Thunderbolt often never come back), so a
# headless box that suspends is a box that needs a hard power cycle.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
