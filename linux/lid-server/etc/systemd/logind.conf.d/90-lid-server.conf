# Keep running with the lid closed, on battery, on AC, or docked.
# Omarchy's own drop-ins (10-ignore-power-button, 20-inhibit-delay) leave the
# lid at logind's default of suspend; this sorts after them and overrides it.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
