# Ghostty settings shared by every host.
# Each platform's config pulls this in with config-file. Included files load
# after the including file, so values here win over the platform config.

# Cursor
cursor-style = block
cursor-style-blink = false

# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
keybind = shift+enter=csi:13;2u
# Send Alt+Shift+Enter as CSI-u so tmux can match M-S-Enter.
keybind = alt+shift+enter=csi:13;4u

# Quick terminal: full width, fixed height, drops from the top.
# Each platform binds toggle_quick_terminal in its own config.
quick-terminal-position = top
quick-terminal-size = 550px
# Hide when focus moves elsewhere (macOS default; Linux defaults to false).
quick-terminal-autohide = true
