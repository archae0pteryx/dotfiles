# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# No CodeRabbit on this repo (see AGENTS.md). The app can still see the repo,
# so this turns off its reviews and everything else it would post on a PR.
reviews:
  auto_review:
    enabled: false
    auto_incremental_review: false
  high_level_summary: false
  review_status: false
  review_progress: false
  commit_status: false
chat:
  auto_reply: false
