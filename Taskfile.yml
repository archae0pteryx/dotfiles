version: '3'

# --no-folding links individual files so apps that write next to their
# config (copyq, kitty, nvim's lazy-lock.json, ...) don't write into this repo.
# Linux hosts still get git/vim config from nix, so SHARED_PKGS is macOS-only.
# COMMON_PKGS are stowed on every host.

vars:
  SHARED_PKGS: git vim
  COMMON_PKGS: ghostty nvim
  MACOS_PKGS: alacritty copyq ghostty hammerspoon kitty starship tmux
  LINUX_PKGS: conky ghostty rofi
  STOW: stow --no-folding -t {{.HOME}}

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  macos:
    desc: Stow macOS configs
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.STOW}} -d . -R {{.SHARED_PKGS}} {{.COMMON_PKGS}}'
      - '{{.STOW}} -d macos -R {{.MACOS_PKGS}}'

  macos:dry:
    desc: Show what stowing macOS configs would do
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.STOW}} -d . -n -v -R {{.SHARED_PKGS}} {{.COMMON_PKGS}}'
      - '{{.STOW}} -d macos -n -v -R {{.MACOS_PKGS}}'

  linux:
    desc: Stow Linux configs
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.STOW}} -d . -R {{.COMMON_PKGS}}'
      - '{{.STOW}} -d linux -R {{.LINUX_PKGS}}'
      - task: linux:ghostty-includes

  linux:dry:
    desc: Show what stowing Linux configs would do
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.STOW}} -d . -n -v -R {{.COMMON_PKGS}}'
      - '{{.STOW}} -d linux -n -v -R {{.LINUX_PKGS}}'

  linux:ghostty-includes:
    desc: Point Omarchy's Ghostty config at the stowed shared/linux layers
    internal: true
    cmds:
      - for: ['shared.conf', 'linux.conf']
        cmd: >-
          grep -qF '~/.config/ghostty/{{.ITEM}}' {{.HOME}}/.config/ghostty/config ||
          printf '\nconfig-file = ?~/.config/ghostty/{{.ITEM}}\n' >> {{.HOME}}/.config/ghostty/config

  # System-level, so installed into /etc with sudo rather than stowed.
  linux:lid-server:
    desc: Keep running with the lid closed (never suspend)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - linux/lid-server/lid-server install

  linux:lid-server:remove:
    desc: Restore suspend on lid close
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - linux/lid-server/lid-server remove

  linux:lid-server:status:
    desc: Check lid, sleep and sshd state
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - linux/lid-server/lid-server status
