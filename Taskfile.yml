version: '3'

# --no-folding keeps files created beside configs out of this repo.

vars:
  SHARED_PKGS: herdr nvim
  MACOS_PKGS:
    sh: find "{{.TASKFILE_DIR}}/macos" -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | tr '\n' ' '
  LINUX_PKGS:
    sh: find "{{.TASKFILE_DIR}}/linux" -mindepth 1 -maxdepth 1 -type d ! -name lid-server -exec basename {} \; | sort | tr '\n' ' '
  STOW: stow --no-folding --ignore='(^|/)\.DS_Store$' -t "{{.HOME}}"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  stow:
    desc: Stow configs ([--mac|--linux] [package], default --mac)
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/stow.sh" stow {{.CLI_ARGS}}'

  stow:dry:
    desc: List differing files ([--mac|--linux] [package], default --mac)
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/stow.sh" dry {{.CLI_ARGS}}'

  macos:
    desc: Stow all macOS configs
    cmds:
      - task: stow:packages
        vars: { dir: ., pkgs: 'ghostty {{.SHARED_PKGS}}' }
      - task: stow:packages
        vars: { dir: macos, pkgs: '{{.MACOS_PKGS}}' }

  macos:dry:
    aliases: [macos:dry-run]
    desc: List existing macOS files whose contents differ
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos {{.SHARED_PKGS}} {{.MACOS_PKGS}}'

  macos:git:
    desc: Stow git config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: git }

  macos:git:dry-run:
    desc: Show what stowing git config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos git'

  macos:vim:
    desc: Stow vim config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: vim }

  macos:vim:dry-run:
    desc: Show what stowing vim config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos vim'

  macos:nvim:
    desc: Stow nvim config
    cmds:
      - task: stow:packages
        vars: { dir: ., pkgs: nvim }

  macos:nvim:dry-run:
    desc: Show what stowing nvim config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos nvim'

  macos:ghostty:
    desc: Stow Ghostty config (shared + macOS layers)
    cmds:
      - task: stow:packages
        vars: { dir: ., pkgs: ghostty }
      - task: stow:packages
        vars: { dir: macos, pkgs: ghostty }

  macos:ghostty:dry-run:
    desc: Show what stowing Ghostty config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos ghostty'

  macos:alacritty:
    desc: Stow alacritty config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: alacritty }

  macos:alacritty:dry-run:
    desc: Show what stowing alacritty config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos alacritty'

  macos:copyq:
    desc: Stow copyq config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: copyq }

  macos:copyq:dry-run:
    desc: Show what stowing copyq config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos copyq'

  macos:hammerspoon:
    desc: Stow hammerspoon config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: hammerspoon }

  macos:hammerspoon:dry-run:
    desc: Show what stowing hammerspoon config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos hammerspoon'

  macos:kitty:
    desc: Stow kitty config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: kitty }

  macos:kitty:dry-run:
    desc: Show what stowing kitty config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos kitty'

  macos:starship:
    desc: Stow starship config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: starship }

  macos:starship:dry-run:
    desc: Show what stowing starship config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos starship'

  macos:tmux:
    desc: Stow tmux config
    cmds:
      - task: stow:packages
        vars: { dir: macos, pkgs: tmux }

  macos:tmux:dry-run:
    desc: Show what stowing tmux config would do
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" macos tmux'

  stow:packages:
    internal: true
    desc: Run stow for one directory's packages
    dir: '{{.TASKFILE_DIR}}'
    vars:
      dir: '{{.dir}}'
      pkgs: '{{.pkgs}}'
    cmds:
      - '{{.STOW}} -d "{{.TASKFILE_DIR}}/{{.dir}}" -R {{.pkgs}}'

  linux:
    desc: Stow Linux configs
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - '{{.STOW}} -d "{{.TASKFILE_DIR}}" -R ghostty {{.SHARED_PKGS}}'
      - '{{.STOW}} -d "{{.TASKFILE_DIR}}/linux" -R {{.LINUX_PKGS}}'
      - task: linux:ghostty-includes

  linux:dry:
    desc: List existing Linux files whose contents differ
    silent: true
    cmds:
      - '"{{.TASKFILE_DIR}}/scripts/dryrun.sh" linux {{.SHARED_PKGS}} {{.LINUX_PKGS}}'

  linux:ghostty:
    desc: Stow Ghostty config (shared + Linux layers)
    cmds:
      - task: stow:packages
        vars: { dir: ., pkgs: ghostty }
      - task: stow:packages
        vars: { dir: linux, pkgs: ghostty }
      - task: linux:ghostty-includes

  linux:ghostty-includes:
    desc: Point Ghostty's regular config file at the stowed shared/Linux layers
    internal: true
    preconditions:
      - sh: test ! -L "{{.HOME}}/.config/ghostty/config"
        msg: Ghostty config is a symlink; make it a regular file before adding includes.
    cmds:
      - touch "{{.HOME}}/.config/ghostty/config"
      - for: ['shared.conf', 'linux.conf']
        cmd: >-
          grep -qxF 'config-file = ?~/.config/ghostty/{{.ITEM}}' "{{.HOME}}/.config/ghostty/config" ||
          printf '\nconfig-file = ?~/.config/ghostty/{{.ITEM}}\n' >> "{{.HOME}}/.config/ghostty/config"

  linux:lid-server:
    desc: Keep running with the lid closed (never suspend)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - linux/lid-server/lid-server install

  linux:lid-server:remove:
    desc: Restore suspend on lid close
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - linux/lid-server/lid-server remove

  linux:lid-server:status:
    desc: Check lid, sleep and sshd state
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - linux/lid-server/lid-server status
